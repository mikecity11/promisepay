name: Verify PromisePay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: contract
      - run: bash scripts/install-toolchain.sh
      - run: npm run build
        working-directory: contract
      - run: node scripts/verify-contract.mjs
      - run: npm ci
        working-directory: integration
      - run: npm test
        working-directory: integration
      - uses: actions/upload-artifact@v4
        with:
          name: promisepay-contract
          path: contract/build/promisepay.wasm
          if-no-files-found: error
